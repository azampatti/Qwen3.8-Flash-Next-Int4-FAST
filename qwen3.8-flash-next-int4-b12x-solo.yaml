# NEEDS (nothing else to copy or build):
#   - the vllm-node-b12x image, identical on both (eugr's build-and-copy.sh copies it to the worker)
#   - the model in the Hugging Face cache: ~/Qwen3.8-Flash-Next-Int4-FAST/setup.sh (the single-node setup) on each node
# The mod (mods/flashnext-int4-b12x) checks the model on every node, builds the served-model view and the slim MTP draft
# folder inside each container (symlinks + small JSON, zero copy) and patches the container's vLLM for this checkpoint.
#

# 2026-09-25 MTP + prefix-cache settings (measured, Prunning/qwen38_flash_next/MTP_GREEDY_MATRIX.md):
#   - draft_sample_method "greedy" (was "probabilistic"): the community mitigation for the MTP degenerate-loop bug (NaN drafter
#     logits after concurrent chunked prefill get accepted by probabilistic sampling). k=4 greedy = same single-stream speed as
#     probabilistic on both images (run.py 74.7 vs 75.3 / 78.4 vs 77.0 tok/s), acceptance a few points lower, ~8-10 % less
#     aggregate throughput at 4 concurrent streams; k=3 greedy is 5-7 % slower than k=4 -> keep 4.
#   - --recurrent-checkpoint-policy aligned: builds from 09-21 on know this checkpoint's model_type (qwen4_exp) and switch it to the
#     "request_boundaries" recurrent-checkpoint policy, under which repeated prompts never hit the prefix cache (1.4 % hit rate,
#     Phase 11 re-prefills ~60K tokens every time); "aligned" restores block-aligned GDN checkpoints = ~75 % hits like the pinned
#     09-13 image (which ignores the policy for this model, so the flag is a no-op there).

recipe_version: "1"
name: Qwen3.8-Flash-Next-INT4-AutoRound (b12x, single node)
description: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound (V8, top-k 5) on a single DGX Spark / GB10 with the b12x stack

model: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: false
solo_only: true

mods:
  - mods/flashnext-int4-b12x

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  served_name: azampatti/Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  block_size: 16
  kv_cache_bytes: 20g
  gpu_memory_utilization: 0.01
  num_speculative_tokens: 4          # MAX: QSA refuses >4 (qsa.py:951). A/B 2026-09-21: 3 = 97.8 tok/s (6 runs); 4 = ~104-105 (tau 4.01)
  load_format: fastsafetensors
  chat_template: medium_chat_template.jinja

env:
  HF_HUB_OFFLINE: "1"
  # b12x stack (as in the working qwen3.8-flash-next-nvfp4-cluster recipe)
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_PLE_TABLE_MEMORY: "disk"
  # this checkpoint (patched in by the mod; as in serve.sh)
  VLLM_FP8_HYBRID: "1"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_USE_DEEP_GEMM: "0"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_MTP_DRAFT_SCALE: "2"

command: |
  vllm serve /workspace/flashnext/model \
    --served-model-name {served_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --enable-expert-parallel \
    --mamba-cache-mode align \
    --recurrent-checkpoint-policy aligned \
    --linear-backend b12x \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype auto \
    --block-size {block_size} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-memory-bytes {kv_cache_bytes} \
    --gdn-decode-kernel b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --chat-template /workspace/flashnext/model/{chat_template} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"model":"/workspace/flashnext/draft-k10","rejection_sample_method":"block","draft_sample_method":"greedy"}}'
